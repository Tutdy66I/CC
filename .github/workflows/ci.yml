name: SignalLab engineering CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate and preserve public multistage DSP evidence
        run: python3 -I -B scripts/v15-multidsp-evidence.py
      - name: Upload public multistage DSP evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: multidsp-public-evidence
          path: react-app/.test-build/multidsp-public-evidence/
          include-hidden-files: true
          retention-days: 14
      - name: Validate and preserve round-two public evidence
        run: |
          python3 -I -B scripts/v15-round2-evidence-selftest.py
          python3 -I -B scripts/v15-round2-evidence.py
      - name: Upload round-two public evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: round-two-public-evidence
          path: react-app/.test-build/round2-public-evidence/
          include-hidden-files: true
          retention-days: 14
      - name: Public numeric audit and fail-closed coverage checks
        run: |
          python3 -I -B scripts/v15-numeric-public-selftest.py
          python3 -I -B scripts/v15-numeric-ci-selftest.py
          python3 -I -B scripts/v15-numeric-public-ci.py
      - name: Preserve public numeric audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: public-numeric-audit
          path: react-app/.test-build/numeric-public/
          include-hidden-files: true
          retention-days: 7
      - name: Independent OFDM DFT, FIR, Toeplitz and scalar receiver references
        run: npm run test:ofdm-reference
        env:
          SIGNALLAB_PYTHON: python3
      - name: Independent comb pilot interpolation and frame energy references
        run: npm run test:ofdm-comb-reference
        env:
          SIGNALLAB_PYTHON: python3
      - name: Independent OFDM synchronization P1 vectors
        run: npm run test:ofdm-sync-reference
        env:
          SIGNALLAB_PYTHON: python3
      - name: v1.4 study protocol, recovery and independent audit fixtures
        run: npm run test:v14-study
        env:
          SIGNALLAB_PYTHON: python3
      - name: Independent channel mathematics and offline protocol tools
        run: npm run test:channel-tools
        env:
          SIGNALLAB_PYTHON: python3
      - name: Independent OFDM study archive, resource ledger and statistical analysis tests
        run: npm run test:ofdm-study
        env:
          SIGNALLAB_PYTHON: python3
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Account sync browser regression with synthetic Supabase responses
        run: npm run test:cloud
      - name: BER benchmark and exact result parity
        run: npm run benchmark:ber -- --output benchmark-results.json
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: signallab-validation
          path: |
            react-app/playwright-report/
            react-app/test-results/
            react-app/benchmark-results.json
          retention-days: 7

  pages-build:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build the static Pages edition
        run: npm run build
        env:
          DEPLOY_BASE_PATH: /CC/
          VITE_STATIC_HOST: "true"
          VITE_EXPERIMENT_SYNC: ${{ vars.SIGNALLAB_EXPERIMENT_SYNC || 'false' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SITE_DOMAIN: tutdy66i.github.io/CC
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: react-app/dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated static artifact
        id: deployment
        uses: actions/deploy-pages@v4
