name: SignalLab engineering CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: BER benchmark and exact result parity
        run: npm run benchmark:ber -- --output benchmark-results.json
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: signallab-validation
          path: |
            react-app/playwright-report/
            react-app/test-results/
            react-app/benchmark-results.json
          retention-days: 7
